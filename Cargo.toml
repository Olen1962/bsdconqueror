[package]
name = "bsdconqueror"
version = "0.20.0"
license = "Unlicense"
edition = "2024"

# Se o teu Cargo.toml já tem eframe numa versão >= 0.29, mantém-na e põe o
# egui_extras NA MESMA versão. Só precisas de acrescentar egui_extras e image.
[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
